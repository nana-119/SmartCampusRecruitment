<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>企业管理 - 管理系统</title>
</head>
<body>
<section th:fragment="section">
    <h2>企业管理</h2>
    <p style="margin: 15px 0;">在此页面可以管理合作企业的基本信息。</p>

    <!-- 筛选和操作区域 -->
    <div style="margin-top: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
        <!-- 公司筛选功能 -->
        <div style="display: flex; align-items: center; gap: 10px;">
            <input type="text"
                   id="companyFilter"
                   name="company"
                   placeholder="请输入公司关键词"
                   th:value="${param.company ?: ''}"
                   style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; width: 200px;">
            <button onclick="filterByCompany()"
                    style="padding: 8px 15px; background-color: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer;">
                <i class="fas fa-search"></i> 筛选
            </button>
            <button onclick="clearFilter()"
                    style="padding: 8px 15px; background-color: #95a5a6; color: white; border: none; border-radius: 4px; cursor: pointer;">
                <i class="fas fa-times"></i> 清除
            </button>
        </div>

        <!-- 添加企业按钮 -->
        <button onclick="openAddRecruiterDialog()" style="padding: 8px 15px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer;">
            <i class="fas fa-plus"></i> 添加企业用户
        </button>
    </div>

    <!-- 添加企业用户对话框 -->
    <div id="addRecruiterDialog" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 1000;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 8px; width: 400px;">
            <h3 style="margin-top: 0;">添加企业用户</h3>
            <form id="addRecruiterForm">
                <div style="margin-bottom: 15px;">
                    <label for="phone" style="display: block; margin-bottom: 5px;">用户账号:</label>
                    <input type="text" id="phone" name="phone" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label for="name" style="display: block; margin-bottom: 5px;">用户名:</label>
                    <input type="text" id="name" name="name" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label for="gender" style="display: block; margin-bottom: 5px;">性别:</label>
                    <select id="gender" name="gender" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <div style="margin-bottom: 15px;">
                    <label for="company" style="display: block; margin-bottom: 5px;">公司:</label>
                    <input type="text" id="company" name="company" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label for="position" style="display: block; margin-bottom: 5px;">职位:</label>
                    <input type="text" id="position" name="position" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label for="password" style="display: block; margin-bottom: 5px;">登录密码:</label>
                    <input type="text" id="password" name="password" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" onclick="closeAddRecruiterDialog()" style="padding: 8px 15px; background-color: #95a5a6; color: white; border: none; border-radius: 4px; cursor: pointer;">取消</button>
                    <button type="submit" style="padding: 8px 15px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer;">确定</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 编辑企业用户对话框 -->
    <div id="editRecruiterDialog" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 1000;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 8px; width: 400px;">
            <h3 style="margin-top: 0;">编辑企业用户</h3>
            <form id="editRecruiterForm">
                <input type="hidden" id="originalPhone" name="originalPhone">
                <div style="margin-bottom: 15px;">
                    <label for="editName" style="display: block; margin-bottom: 5px;">用户名:</label>
                    <input type="text" id="editName" name="name" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label for="editGender" style="display: block; margin-bottom: 5px;">性别:</label>
                    <select id="editGender" name="gender" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <div style="margin-bottom: 15px;">
                    <label for="editCompany" style="display: block; margin-bottom: 5px;">公司:</label>
                    <input type="text" id="editCompany" name="company" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label for="editPosition" style="display: block; margin-bottom: 5px;">职位:</label>
                    <input type="text" id="editPosition" name="position" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label for="editPhone" style="display: block; margin-bottom: 5px;">联系电话:</label>
                    <input type="text" id="editPhone" name="phone" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label for="editPassword" style="display: block; margin-bottom: 5px;">登录密码:</label>
                    <input type="text" id="editPassword" name="password" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" onclick="closeEditRecruiterDialog()" style="padding: 8px 15px; background-color: #95a5a6; color: white; border: none; border-radius: 4px; cursor: pointer;">取消</button>
                    <button type="submit" style="padding: 8px 15px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer;">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 删除确认对话框 -->
    <div id="deleteRecruiterConfirmDialog" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); z-index: 1000;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 8px; width: 400px;">
            <h3 style="margin-top: 0;">确认删除</h3>
            <p>确定要删除该企业用户数据吗？</p>
            <input type="hidden" id="deleteRecruiterPhone">
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" onclick="closeDeleteRecruiterConfirmDialog()" style="padding: 8px 15px; background-color: #95a5a6; color: white; border: none; border-radius: 4px; cursor: pointer;">取消</button>
                <button type="button" onclick="confirmDeleteRecruiter()" style="padding: 8px 15px; background-color: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer;">确定</button>
            </div>
        </div>
    </div>

    <script>
        // 定义筛选函数（在全局作用域）
        function filterByCompany() {
            const company = document.getElementById('companyFilter').value.trim();
            const baseUrl = window.location.pathname;

            if (company) {
                window.location.href = `${baseUrl}?company=${encodeURIComponent(company)}`;
            } else {
                // 如果公司名为空，也执行跳转以确保显示所有数据
                window.location.href = baseUrl;
            }
        }

        // 定义清除筛选函数（在全局作用域）
        function clearFilter() {
            document.getElementById('companyFilter').value = '';
            window.location.href = window.location.pathname;
        }

        function openAddRecruiterDialog() {
            document.getElementById('addRecruiterDialog').style.display = 'block';
            document.getElementById('addRecruiterForm').reset();
        }

        function closeAddRecruiterDialog() {
            document.getElementById('addRecruiterDialog').style.display = 'none';
        }

        function openEditRecruiterDialog(phone) {
            // 发送 AJAX 请求获取企业用户详细信息
            fetch(`/recruiterList/get?phone=${encodeURIComponent(phone)}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(recruiter => {
                    // 填充表单数据
                    document.getElementById('originalPhone').value = recruiter.phone; // 保存原始手机号
                    document.getElementById('editName').value = recruiter.name;
                    document.getElementById('editGender').value = recruiter.gender;
                    document.getElementById('editCompany').value = recruiter.company;
                    document.getElementById('editPosition').value = recruiter.position;
                    document.getElementById('editPhone').value = recruiter.phone; // 当前手机号
                    document.getElementById('editPassword').value = recruiter.password;

                    // 显示对话框
                    document.getElementById('editRecruiterDialog').style.display = 'block';
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('获取企业用户信息失败');
                });
        }

        function closeEditRecruiterDialog() {
            document.getElementById('editRecruiterDialog').style.display = 'none';
        }

        function openDeleteRecruiterConfirmDialog(phone) {
            document.getElementById('deleteRecruiterPhone').value = phone;
            document.getElementById('deleteRecruiterConfirmDialog').style.display = 'block';
        }

        function closeDeleteRecruiterConfirmDialog() {
            document.getElementById('deleteRecruiterConfirmDialog').style.display = 'none';
        }

        function confirmDeleteRecruiter() {
            const phone = document.getElementById('deleteRecruiterPhone').value;
            if (!phone) {
                alert('无效的账号');
                return;
            }
            // 发送删除请求
            fetch(`/recruiterList/delete?phone=${encodeURIComponent(phone)}`, {
                method: 'POST'
            })
                .then(response => {
                    if (response.ok) {
                        alert('企业用户删除成功');
                        closeDeleteRecruiterConfirmDialog();
                        location.reload(); // 刷新页面
                    } else {
                        alert('删除失败');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('删除失败');
                });
        }

        // 页面加载完成后绑定事件
        document.addEventListener('DOMContentLoaded', function() {
            // 绑定回车键事件
            const input = document.getElementById('companyFilter');
            if (input) {
                input.addEventListener('keyup', function(event) {
                    if (event.key === 'Enter') {
                        filterByCompany();
                    }
                });
            }

            const addRecruiterForm = document.getElementById('addRecruiterForm');
            if (addRecruiterForm) {
                addRecruiterForm.addEventListener('submit', function(e) {
                    e.preventDefault();

                    // 获取表单数据
                    const formData = new FormData(addRecruiterForm);
                    const recruiterData = {
                        phone: formData.get('phone'),
                        name: formData.get('name'),
                        gender: formData.get('gender'),
                        company: formData.get('company'),
                        position: formData.get('position'),
                        password: formData.get('password')
                    };

                    // 发送 AJAX 请求
                    fetch('/recruiterList/add', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(recruiterData)
                    })
                        .then(response => {
                            if (response.ok) {
                                alert('企业用户添加成功');
                                closeAddRecruiterDialog();
                                location.reload(); // 刷新页面以显示新数据
                            } else {
                                alert('添加失败，请重试');
                            }
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            alert('添加失败，请重试');
                        });
                });
            }

            const editRecruiterForm = document.getElementById('editRecruiterForm');
            if (editRecruiterForm) {
                editRecruiterForm.addEventListener('submit', function(e) {
                    e.preventDefault();

                    // 获取表单数据
                    const formData = new FormData(editRecruiterForm);
                    const recruiterData = {
                        originalPhone: formData.get('originalPhone'), // 原始手机号
                        name: formData.get('name'),
                        gender: formData.get('gender'),
                        company: formData.get('company'),
                        position: formData.get('position'),
                        phone: formData.get('phone'), // 新手机号
                        password: formData.get('password')
                    };

                    // 验证手机号是否为空
                    if (!recruiterData.phone || recruiterData.phone.trim() === '') {
                        alert('手机号不能为空');
                        return;
                    }

                    // 发送更新请求
                    fetch('/recruiterList/update', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(recruiterData)
                    })
                        .then(response => {
                            if (response.ok) {
                                alert('企业用户信息更新成功');
                                closeEditRecruiterDialog();
                                location.reload(); // 刷新页面
                            } else {
                                return response.text().then(text => {
                                    alert('更新失败: ' + text);
                                    throw new Error(text);
                                });
                            }
                        })
                        .catch(error => {
                            console.error('Error:', error);
                            alert('更新失败');
                        });
                });
            }
        });
    </script>

    <!-- 企业用户列表区域 -->
    <div style="margin-top: 20px; border: 1px solid #eee; border-radius: 6px; overflow: hidden;">
        <table style="width: 100%; border-collapse: collapse;">
            <thead style="background-color: #f8f9fa;">
            <tr>
                <th style="padding: 12px; text-align: left; border-bottom: 1px solid #eee;">用户账号</th>
                <th style="padding: 12px; text-align: left; border-bottom: 1px solid #eee;">用户名</th>
                <th style="padding: 12px; text-align: left; border-bottom: 1px solid #eee;">性别</th>
                <th style="padding: 12px; text-align: left; border-bottom: 1px solid #eee;">公司</th>
                <th style="padding: 12px; text-align: left; border-bottom: 1px solid #eee;">职位</th>
                <th style="padding: 12px; text-align: left; border-bottom: 1px solid #eee;">操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="recruiter : ${recruiterList}">
                <td style="padding: 12px; border-bottom: 1px solid #eee;" th:text="${recruiter.phone}"></td>
                <td style="padding: 12px; border-bottom: 1px solid #eee;" th:text="${recruiter.name}"></td>
                <td style="padding: 12px; border-bottom: 1px solid #eee;" th:text="${recruiter.gender}"></td>
                <td style="padding: 12px; border-bottom: 1px solid #eee;" th:text="${recruiter.company}"></td>
                <td style="padding: 12px; border-bottom: 1px solid #eee;" th:text="${recruiter.position}"></td>
                <td style="padding: 12px; border-bottom: 1px solid #eee;">
                    <a href="javascript:void(0)"
                       th:data-phone="${recruiter.phone}"
                       onclick="openEditRecruiterDialog(this.getAttribute('data-phone'))"
                       style="color: #3498db; margin-right: 10px;">
                        <i class="fas fa-edit"></i> 编辑
                    </a>
                    <a href="javascript:void(0)"
                       th:data-phone="${recruiter.phone}"
                       onclick="openDeleteRecruiterConfirmDialog(this.getAttribute('data-phone'))"
                       style="color: #e74c3c;">
                        <i class="fas fa-trash"></i> 删除
                    </a>
                </td>
            </tr>

            <!-- 当没有企业用户数据时显示 -->
            <tr th:if="${recruiterList.isEmpty()}">
                <td colspan="6" style="padding: 20px; text-align: center; color: #777;">
                    暂无企业用户数据
                </td>
            </tr>
        </table>
    </div>
</section>
</body>
</html>
