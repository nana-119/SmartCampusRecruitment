<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>简洁简历</title>
  <style>
    /* 基础样式重置，确保IText正确解析 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* 页面设置 - 与ITextRenderer的@page配置匹配 */
    @page {
      size: A4 portrait;
      margin: 20mm;
    }

    body {
      font-family: "SimSun", "PingFang SC", Arial, sans-serif; /* 优先确保宋体优先，兼容IText */
      font-size: 14px;
      color: #333333;
      line-height: 1.6; /* 增加行高，提升可读性 */
    }

    /* 头部信息表格 - 确保表格布局稳定 */
    table.header {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 25px;
      table-layout: fixed; /* 固定表格布局，防止内容溢出 */
    }

    .avatar-container {
      width: 110px;
      vertical-align: top;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border: 2px solid #cccccc;
      display: block; /* 确保图片正确显示 */
    }

    .info-container {
      padding-left: 15px;
      vertical-align: top;
    }

    h1 {
      font-size: 24px;
      color: #222222;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .contact-info {
      margin-bottom: 5px;
      font-size: 13px;
    }

    /* 标题样式 - 确保边框显示正确 */
    h2 {
      font-size: 18px;
      color: #222222;
      margin: 25px 0 12px 0;
      padding-bottom: 5px;
      border-bottom: 1px solid #dddddd;
      font-weight: bold;
    }

    /* 内容表格样式 */
    table.content {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 10px;
    }

    table.content tr {
      page-break-inside: avoid; /* 防止内容被分页截断 */
    }

    table.content td {
      padding: 6px 0;
      vertical-align: top;
    }

    /* 教育经历特殊样式 */
    .education-item td:first-child {
      width: 70%;
    }

    .education-item td:last-child {
      width: 30%;
      text-align: right;
    }

    /* 工作经历特殊样式 */
    .experience-item td {
      width: 100%;
    }

    .company-position {
      font-weight: bold;
      margin-bottom: 3px;
      display: block;
    }

    .experience-date {
      color: #666666;
      font-size: 13px;
      margin-bottom: 5px;
      display: block;
    }

    .experience-desc {
      text-align: justify; /* 文本两端对齐 */
    }

    /* 确保图片在PDF中正确渲染 */
    img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>

<body>
<!-- 头像 + 基本信息 -->
<table class="header">
  <tr>
    <td class="avatar-container">
      <img th:src="'data:image/png;base64,' + ${avatar}" class="avatar" alt="个人头像"/>
    </td>
    <td class="info-container">
      <h1 th:text="${name}"></h1>
      <p class="contact-info" th:text="'邮箱：' + ${email} + ' | 电话：' + ${phone}"></p>
      <p class="contact-info" th:text="'技能：' + ${skills}"></p>
    </td>
  </tr>
</table>

<!-- 教育经历 -->
<h2>教育经历</h2>
<table class="content">
  <tr class="education-item" th:each="e : ${educations}">
    <td th:text="${e.school} + ' · ' + ${e.major}"></td>
    <td th:text="${e.startDate} + ' - ' + ${e.endDate}"></td>
  </tr>
</table>

<!-- 工作经历 -->
<h2>工作经历</h2>
<table class="content">
  <tr class="experience-item" th:each="w : ${experiences}">
    <td>
      <span class="company-position" th:text="${w.company} + ' - ' + ${w.position}"></span>
      <span class="experience-date" th:text="${w.startDate} + ' - ' + ${w.endDate}"></span>
      <span class="experience-desc" th:text="${w.description}"></span>
    </td>
  </tr>
</table>
</body>
</html>
