<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <title>创意简历</title>
    <style>
        /* 基础样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 页面设置 */
        @page {
            size: A4 portrait;
            margin: 15mm;
            background-color: #f1f1f1;
        }

        body {
            font-family: "SimSun", 'Segoe UI', Tahoma, sans-serif;
            background-color: #f1f1f1;
            line-height: 1.6;
            color: #333;
        }

        /* 卡片容器 */
        .card-container {
            width: 100%;
            border-collapse: collapse;
            margin: 0 auto;
        }

        .card {
            max-width: 800px;
            margin: 40px auto;
            background-color: #fff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
        }

        /* 头部横幅 - 表格布局 */
        table.banner {
            width: 100%;
            height: 140px;
            background: #0072ff;
            color: #fff;
            border-collapse: collapse;
        }

        .banner-avatar {
            width: 130px;
            padding: 0 20px 0 40px;
            vertical-align: middle; /* 关键：确保单元格内容垂直居中 */
        }

        .banner-info {
            padding: 0 40px 0 0;
            vertical-align: middle;
        }

        /* 头像容器 - 解决位置偏移核心样式 */
        .avatar-wrapper {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #fff;
            position: relative; /* 建立定位上下文 */
            display: inline-block; /* 确保容器尺寸正确 */
            line-height: 0; /* 消除基线对齐导致的偏移 */
        }

        /* 头像图片 - 强制在容器内显示 */
        .avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block; /* 消除图片底部间隙 */
            position: relative; /* 相对定位确保在容器内 */
            top: 0;
            left: 0;
        }

        .banner h1 {
            font-size: 26px;
            margin: 0 0 10px 0;
        }

        .banner p {
            font-size: 14px;
            opacity: 0.9;
        }

        /* 内容区域 */
        .content {
            padding: 30px 40px;
        }

        h2 {
            margin: 20px 0 12px 0;
            color: #0072ff;
            font-size: 18px;
            padding-bottom: 5px;
            border-bottom: 2px solid #f0f0f0;
        }

        /* 列表样式 */
        ul {
            list-style-position: inside;
            margin-left: 5px;
            margin-bottom: 15px;
        }

        li {
            margin: 10px 0;
            padding-left: 5px;
        }

        /* 工作经历样式 */
        .experience-item strong {
            color: #222;
        }

        .experience-date {
            color: #666;
            display: block;
            margin: 3px 0;
        }

        .experience-desc {
            margin-top: 5px;
            text-align: justify;
        }

        /* 分页控制 */
        .section {
            page-break-inside: avoid;
        }
    </style>
</head>
<body>
<table class="card-container">
    <tr>
        <td>
            <div class="card">
                <!-- 头部横幅 -->
                <table class="banner">
                    <tr>
                        <td class="banner-avatar">
                            <!-- 头像容器：解决图片溢出问题 -->
                            <div class="avatar-wrapper">
                                <img th:src="'data:image/png;base64,' + ${avatar}" class="avatar" alt="个人头像"/>
                            </div>
                        </td>
                        <td class="banner-info">
                            <h1 th:text="${name}">张三</h1>
                            <p th:text="${email} + ' | ' + ${phone} + ' | ' + ${skills}">
                            </p>
                        </td>
                    </tr>
                </table>

                <div class="content">
                    <div class="section">
                        <h2>Education</h2>
                        <ul>
                            <li th:each="e : ${educations}" th:text="|${e.school} — ${e.major} (${e.startDate} ~ ${e.endDate})|">
                            </li>
                        </ul>
                    </div>

                    <div class="section">
                        <h2>Experience</h2>
                        <ul>
                            <li class="experience-item" th:each="w : ${experiences}">
                                <strong th:text="${w.company} +'-'+ ${w.position}"></strong>
                                <span class="experience-date" th:text="'(' + ${w.startDate} + '~' + ${w.endDate} + ')'"></span>
                                <span class="experience-desc" th:text="${w.description}"></span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </td>
    </tr>
</table>
</body>
</html>
